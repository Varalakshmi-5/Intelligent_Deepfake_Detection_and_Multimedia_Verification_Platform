{% extends "base.html" %}
{% block title %}Reset Password · VeriScan AI{% endblock %}
{% block navbar %}{% endblock %}
{% block content %}
<div class="auth-shell" style="grid-template-columns: 1fr;">
  <div class="auth-form-side">
    <div class="auth-box card">
      <h2>Reset your password</h2>
      <p class="mb-16">Choose a new password for <strong>{{ email }}</strong>.</p>
      <form method="post">
        {% csrf_token %}
        <div class="field">
          <label>New password</label>
          <input type="password" name="password" required placeholder="At least 8 characters, 1 letter, 1 number">
        </div>
        <div class="field">
          <label>Confirm new password</label>
          <input type="password" name="confirm_password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
      </form>
      <div class="form-footer">
        <a href="{% url 'accounts:landing' %}">← Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
