{% extends "base.html" %}
{% block title %}Forgot Password · VeriScan AI{% endblock %}
{% block navbar %}{% endblock %}
{% block content %}
<div class="auth-shell" style="grid-template-columns: 1fr;">
  <div class="auth-form-side">
    <div class="auth-box card">
      <h2>Forgot your password?</h2>
      <p class="mb-16">Enter your email and we'll send you a reset code.</p>
      <form method="post">
        {% csrf_token %}
        <div class="field">
          <label>Email address</label>
          <input type="email" name="email" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Reset Code</button>
      </form>
      <div class="form-footer">
        <a href="{% url 'accounts:landing' %}">← Back to login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
