<button class="chatbot-toggle" id="chatbot-toggle" aria-label="Ask about this result">💬</button>
<div class="chatbot-panel" id="chatbot-panel">
  <div class="chatbot-header">
    <span>🤖 Ask about this result</span>
    <button id="chatbot-close" type="button">✕</button>
  </div>
  <div class="chatbot-messages" id="chatbot-messages"></div>
  <div class="chatbot-input-row">
    <input type="text" id="chatbot-input" placeholder="Ask a question...">
    <button id="chatbot-send" type="button">Send</button>
  </div>
</div>
